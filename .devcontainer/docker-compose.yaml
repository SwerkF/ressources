services:
  app:
    build:
      context: ../ # Point vers le dossier racine de votre projet
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Port pour le frontend
      - "3000:3000" # Port pour l'API backend
    volumes:
      - ..:/workspace:cached # Montez le répertoire de travail
    environment:
      NODE_ENV: development

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
