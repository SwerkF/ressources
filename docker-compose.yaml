version: '3'
services:
  app:
    build: .
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
      - "3306:3306"
      - "5173:5173"
    depends_on:
      - db
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
    ports:
      - "3306:3306"
